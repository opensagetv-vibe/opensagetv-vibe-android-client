<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenSageTV VIBE Download</title>
</head>
<body>
<script>
const api =
  "https://api.github.com/repos/opensagetv-vibe/opensagetv-vibe-android-client/releases/latest";

fetch(api)
  .then(response => {
    if (!response.ok) {
      throw new Error("GitHub API error: " + response.status);
    }
    return response.json();
  })
  .then(release => {
    const apk = release.assets.find(asset =>
      /^OpenSageTV-Vibe-Android-Client-v.*\.apk$/i.test(asset.name)
    );

    if (!apk) {
      throw new Error("APK not found in latest release");
    }

    window.location.replace(apk.browser_download_url);
  })
  .catch(error => {
    document.body.innerHTML =
      "<h2>Unable to locate latest APK</h2><p>" +
      error.message +
      "</p>";
  });
</script>

<p>Finding latest OpenSageTV VIBE APK...</p>
</body>
</html>
