apply plugin: 'com.android.library'


android {
    namespace "sagex.miniclient.android"
    buildToolsVersion androidBuildToolsVersion
    compileSdkVersion androidCompileSdkVersion
    ndkVersion = "21.0.6113669"

    compileOptions {
        //sourceCompatibility defJavaVesionConst
        //targetCompatibility defJavaVesionConst
        sourceCompatibility 1.8
        targetCompatibility 1.8

    }

    sourceSets {
        main {
            //manifest.srcFile 'AndroidManifest.xml'
            //java.srcDirs = ['src']
            //aidl.srcDirs = ['src']
            //renderscript.srcDirs = ['src']
            //res.srcDirs = ['res']
            //assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }

        //instrumentTest.setRoot('tests')
    }
    lintOptions {
        abortOnError false
    }

    defaultConfig {
        minSdkVersion androidMinSdkVersion
        targetSdkVersion androidTargetSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    buildToolsVersion "${androidBuildToolsVersion}"


}

configurations {
    natives
}

dependencies {

    api project(":core")

    implementation "androidx.preference:preference:1.1.1"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.appcompat:appcompat:1.3.1"

    implementation group: 'com.google.guava', name: 'guava', version: '28.1-android'

    // gdx
    api("com.badlogicgames.gdx:gdx:$gdxVersion") {
        exclude group: 'xerces'
        exclude group: 'xpp3'
    }

    api "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    // Legacy ExoPlayer baseline. Use normal module metadata under Gradle 8 so
    // the published dependency graph participates in version alignment.  Do not
    // use @aar artifact-only notation here.  Test utilities are intentionally not
    // packaged in the production application.
    api "com.google.android.exoplayer:exoplayer-common:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-extractor:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-core:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-ui:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-datasource:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-decoder:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-dash:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-rtsp:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-transformer:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-smoothstreaming:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-hls:${exoVersion}"
    api 'com.google.guava:guava:31.0-jre' //This appears to be required for Exoplayer

    api(name: "extension-ffmpeg-${exoVersionCustomExt}", ext: 'aar') // audio decoder extension only; no legacy Exo core classes are bundled

    // AndroidX Media3 / current Google ExoPlayer. Keep all Media3 modules on exactly one version.
    api "androidx.media3:media3-common:${media3Version}"
    api "androidx.media3:media3-datasource:${media3Version}"
    api "androidx.media3:media3-exoplayer:${media3Version}"
    api "androidx.media3:media3-exoplayer-dash:${media3Version}"
    api "androidx.media3:media3-exoplayer-hls:${media3Version}"
    api "androidx.media3:media3-exoplayer-rtsp:${media3Version}"
    api "androidx.media3:media3-exoplayer-smoothstreaming:${media3Version}"
    api "androidx.media3:media3-ui:${media3Version}"


    // Legacy SageTV IJK backend: preserve the original 0.8.8 Java/JNI runtime.
    // Do not replace these AARs with GSY IJK; the two runtimes share the same
    // tv.danmaku.ijk Java/JNI namespace and cannot safely coexist in one APK.
    api(name: "ijkplayer-java-${ijkVersionDev}", ext: "aar")
    api(name: "ijkplayer-armv7a-${ijkVersionDev}", ext: "aar")
    api(name: "ijkplayer-arm64-${ijkVersionDev}", ext: "aar")
    api(name: "ijkplayer-x86-${ijkVersionDev}", ext: "aar")

    // GSYVideoPlayer framework + Media3/Exo manager support.  Explicitly exclude
    // GSY's modern IJK Java bridge so it cannot replace/collide with legacy IJK.
    api("io.github.carguo:gsyvideoplayer-java:${gsyVersion}") {
        exclude group: "io.github.carguo", module: "gsyijkjava"
    }
    api("io.github.carguo:gsyvideoplayer-exo2:${gsyVersion}") {
        exclude group: "io.github.carguo", module: "gsyijkjava"
        // SageTV does not use RTMP. GSY 13.1.0 declares the legacy mcxinyu
        // RTMP client as a compile dependency; excluding it avoids an obsolete
        // Sonatype/JitPack certificate dependency and keeps this backend lean.
        exclude group: "com.github.mcxinyu", module: "LibRtmp-Client-for-Android"
        exclude group: "androidx.media3", module: "media3-datasource-rtmp"
    }

    // logging
    // android-shared imports SLF4J directly. With Gradle 8, core's implementation
    // dependency is not exported transitively onto this module's compile classpath.
    api "org.slf4j:slf4j-api:1.7.6"
    api "com.github.tony19:logback-android-core:1.1.1-6"
    api("com.github.tony19:logback-android-classic:1.1.1-6") {
        exclude group: 'com.google.android', module: 'android'
    }

    api 'com.github.rahatarmanahmed:circularprogressview:2.4.0'

    // simple event bus
    api 'com.squareup:otto:1.3.8'

    implementation 'org.jetbrains:annotations:16.0.2'

}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives() {

    configurations.getByName("natives").copy().files.each { jar ->
        def outputDir = null
        if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
        if (jar.name.endsWith("natives-armeabi.jar")) outputDir = file("libs/armeabi")
        if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
        if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
        if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
        if (outputDir != null) {
            copy {
                from zipTree(jar)
                into outputDir
                include "*.so"
            }
        }
    }
}
