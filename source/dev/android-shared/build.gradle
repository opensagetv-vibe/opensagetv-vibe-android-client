apply plugin: 'com.android.library'


android {
    namespace "opensagetv.vibe.miniclient.android"
    buildToolsVersion androidBuildToolsVersion
    compileSdkVersion androidCompileSdkVersion
    ndkVersion = "21.0.6113669"

    compileOptions {
        //sourceCompatibility defJavaVesionConst
        //targetCompatibility defJavaVesionConst
        sourceCompatibility 1.8
        targetCompatibility 1.8

    }

    sourceSets {
        main {
            //manifest.srcFile 'AndroidManifest.xml'
            //java.srcDirs = ['src']
            //aidl.srcDirs = ['src']
            //renderscript.srcDirs = ['src']
            //res.srcDirs = ['res']
            //assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }

        //instrumentTest.setRoot('tests')
    }
    packaging {
        jniLibs {
            // Historical extraction left this unused ARM32-only GDX helper in
            // some working trees. Exclude it at the package boundary as well
            // as from new extraction so clean and incremental builds match.
            excludes += ['**/libgdx-freetype.so']
        }
    }
    lintOptions {
        abortOnError false
    }

    defaultConfig {
        minSdkVersion androidMinSdkVersion
        targetSdkVersion androidTargetSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    buildToolsVersion "${androidBuildToolsVersion}"


}

configurations {
    natives
}

// Removing GSY's unused Cast/Session surface must not silently downgrade the
// rest of the already-tested AndroidX/Kotlin graph. These are the selected
// non-Cast versions from the physical v0.5.83 baseline. Keep the list explicit
// so future family upgrades remain deliberate and independently testable.
def retainedNonCastVersions = [
    "androidx.activity:activity": "1.8.2",
    "androidx.annotation:annotation": "1.9.1",
    "androidx.annotation:annotation-experimental": "1.4.1",
    "androidx.annotation:annotation-jvm": "1.9.1",
    "androidx.appcompat:appcompat": "1.6.1",
    "androidx.appcompat:appcompat-resources": "1.6.1",
    "androidx.collection:collection": "1.5.0",
    "androidx.core:core": "1.16.0",
    "androidx.core:core-ktx": "1.16.0",
    "androidx.emoji2:emoji2": "1.4.0",
    "androidx.emoji2:emoji2-views-helper": "1.4.0",
    "androidx.lifecycle:lifecycle-common": "2.9.4",
    "androidx.lifecycle:lifecycle-common-jvm": "2.9.4",
    "androidx.lifecycle:lifecycle-livedata": "2.9.4",
    "androidx.lifecycle:lifecycle-livedata-core": "2.9.4",
    "androidx.lifecycle:lifecycle-livedata-core-ktx": "2.9.4",
    "androidx.lifecycle:lifecycle-process": "2.9.4",
    "androidx.lifecycle:lifecycle-runtime": "2.9.4",
    "androidx.lifecycle:lifecycle-runtime-android": "2.9.4",
    "androidx.lifecycle:lifecycle-service": "2.9.4",
    "androidx.lifecycle:lifecycle-viewmodel": "2.9.4",
    "androidx.lifecycle:lifecycle-viewmodel-android": "2.9.4",
    "androidx.lifecycle:lifecycle-viewmodel-savedstate": "2.9.4",
    "androidx.media:media": "1.7.0",
    "androidx.profileinstaller:profileinstaller": "1.4.0",
    "androidx.savedstate:savedstate": "1.3.2",
    "androidx.tracing:tracing": "1.2.0",
    "androidx.transition:transition": "1.6.0",
    "org.jetbrains.kotlin:kotlin-stdlib-common": "2.2.0",
    "org.jetbrains.kotlinx:kotlinx-coroutines-android": "1.9.0",
    "org.jetbrains.kotlinx:kotlinx-coroutines-bom": "1.9.0",
    "org.jetbrains.kotlinx:kotlinx-coroutines-core": "1.9.0",
    "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm": "1.9.0",
]

dependencies {

    constraints {
        retainedNonCastVersions.each { coordinate, version ->
            implementation("${coordinate}:${version}") {
                because("preserve the physically-tested non-Cast runtime graph")
            }
        }
    }

    api project(":core")

    implementation "androidx.preference:preference:1.1.1"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.appcompat:appcompat:1.3.1"

    implementation group: 'com.google.guava', name: 'guava', version: '28.1-android'

    // gdx
    api("com.badlogicgames.gdx:gdx:$gdxVersion") {
        exclude group: 'xerces'
        exclude group: 'xpp3'
    }

    api "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"

    // Legacy ExoPlayer baseline. Use normal module metadata under Gradle 8 so
    // the published dependency graph participates in version alignment.  Do not
    // use @aar artifact-only notation here.  Test utilities are intentionally not
    // packaged in the production application.
    api "com.google.android.exoplayer:exoplayer-common:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-extractor:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-core:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-ui:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-datasource:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-decoder:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-dash:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-rtsp:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-transformer:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-smoothstreaming:${exoVersion}"
    api "com.google.android.exoplayer:exoplayer-hls:${exoVersion}"
    api 'com.google.guava:guava:31.0-jre' //This appears to be required for Exoplayer

    api(name: "extension-ffmpeg-${exoVersionCustomExt}", ext: 'aar') // audio decoder extension only; no legacy Exo core classes are bundled

    // AndroidX Media3 / current Google ExoPlayer. Keep all Media3 modules on exactly one version.
    api "androidx.media3:media3-common:${media3Version}"
    api "androidx.media3:media3-datasource:${media3Version}"
    api "androidx.media3:media3-exoplayer:${media3Version}"
    api "androidx.media3:media3-exoplayer-dash:${media3Version}"
    api "androidx.media3:media3-exoplayer-hls:${media3Version}"
    api "androidx.media3:media3-exoplayer-rtsp:${media3Version}"
    api "androidx.media3:media3-exoplayer-smoothstreaming:${media3Version}"
    api "androidx.media3:media3-ui:${media3Version}"

    // SMB Direct reads ordinary SageTV Pull media through SMB2/SMB3 while a
    // shadow MediaServer session retains SageTV playback ownership. SMBJ is
    // Apache-2.0, Android-aware, and deliberately isolated to this Android
    // module so Core protocol/path-mapping tests remain platform-independent.
    implementation("com.hierynomus:smbj:${smbjVersion}") {
        // The app's current Logback Android binding implements the SLF4J 1.7
        // API. SMBJ uses only the classic Logger calls, so retain the compatible
        // 1.7 API selected by the existing graph instead of introducing two
        // incompatible SLF4J generations into one APK.
        exclude group: "org.slf4j", module: "slf4j-api"
    }


    // Legacy SageTV IJK backend: preserve the original 0.8.8 Java/JNI runtime.
    // Do not replace these AARs with GSY IJK; the two runtimes share the same
    // tv.danmaku.ijk Java/JNI namespace and cannot safely coexist in one APK.
    api(name: "ijkplayer-java-${ijkVersionDev}", ext: "aar")
    api(name: "ijkplayer-armv7a-${ijkVersionDev}", ext: "aar")
    api(name: "ijkplayer-arm64-${ijkVersionDev}", ext: "aar")

    // GSYVideoPlayer framework + Media3/Exo manager support.  Explicitly exclude
    // GSY's modern IJK Java bridge so it cannot replace/collide with legacy IJK.
    api("io.github.carguo:gsyvideoplayer-java:${gsyVersion}") {
        exclude group: "io.github.carguo", module: "gsyijkjava"
    }
    api("io.github.carguo:gsyvideoplayer-exo2:${gsyVersion}") {
        exclude group: "io.github.carguo", module: "gsyijkjava"
        // GSY publishes Media3 Cast support as an unconditional dependency,
        // but this MiniClient neither constructs CastPlayer nor exposes a Cast
        // session.  Keeping it merged adds Google Cast/DataTransport and an
        // exported validation activity to every APK without providing a SageTV
        // playback feature.  The GSY Exo2 bytecode has no Cast API references,
        // so exclude only this optional surface and retain its ordinary Media3
        // player dependencies.
        exclude group: "androidx.media3", module: "media3-cast"
        // GSY also publishes Media3 Session unconditionally. SageTV owns the
        // playback session over the MiniPlayer protocol and this backend does
        // not reference MediaSession APIs, so retaining it only merges media
        // browsing/validation components into the APK.
        exclude group: "androidx.media3", module: "media3-session"
        // SageTV does not use RTMP. GSY 13.1.0 declares the legacy mcxinyu
        // RTMP client as a compile dependency; excluding it avoids an obsolete
        // Sonatype/JitPack certificate dependency and keeps this backend lean.
        exclude group: "com.github.mcxinyu", module: "LibRtmp-Client-for-Android"
        exclude group: "androidx.media3", module: "media3-datasource-rtmp"
    }

    // logging
    // android-shared imports SLF4J directly. With Gradle 8, core's implementation
    // dependency is not exported transitively onto this module's compile classpath.
    api "org.slf4j:slf4j-api:1.7.6"
    api "com.github.tony19:logback-android-core:1.1.1-6"
    api("com.github.tony19:logback-android-classic:1.1.1-6") {
        exclude group: 'com.google.android', module: 'android'
    }

    api 'com.github.rahatarmanahmed:circularprogressview:2.4.0'

    // simple event bus

    implementation 'org.jetbrains:annotations:16.0.2'

}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives() {

    configurations.getByName("natives").copy().files.each { jar ->
        def outputDir = null
        if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
        if (jar.name.endsWith("natives-armeabi.jar")) outputDir = file("libs/armeabi")
        if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
        if (outputDir != null) {
            copy {
                from zipTree(jar)
                into outputDir
                // The client does not use GDX FreeType. Excluding it keeps the
                // ARM32 and ARM64 native sets identical; the upstream GDX
                // ARM64 native archive does not publish this unused library.
                include "libgdx.so"
            }
        }
    }
}
