name: opensagetv-vibe-android-client

services:
  dev:
    image: opensagetv-vibe-android-client-dev:jammy-j17
    container_name: opensagetv-vibe-android-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    command: ["sleep", "infinity"]
    init: true
    environment:
      SAGETV_WORKSPACE: /workspace
      SAGETV_DEV_SOURCE: /workspace/source/dev
      SAGETV_EXISTING_SOURCE: /workspace/source/existing
      SAGETV_MCP_CONFIG: /workspace/config/firetv.toml
      SAGETV_ARTIFACT_DIR: /workspace/artifacts/firetv
      PYTHONPATH: /workspace/mcp/src
    volumes:
      # Entire human-visible project/workspace lives in one Windows root.
      - type: bind
        source: "${OPENSAGETV_VIBE_ANDROID_ROOT:-.}"
        target: /workspace
      # Cache-heavy Gradle data stays Docker-managed for filesystem performance.
      - type: volume
        source: gradle-cache
        target: /gradle-cache

volumes:
  gradle-cache:
    name: opensagetv-vibe-android-gradle-cache
